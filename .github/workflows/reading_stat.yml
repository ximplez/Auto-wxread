name: ReadingStat

concurrency:
  group: ${{ github.workflow }} # 使用工作流名称作为并发组的key
  cancel-in-progress: true    # 取消任何正在进行的相同并发组的工作流

permissions:
  actions: write

on:
#  schedule:
#    # 午间任务：北京时间每天 14:02（UTC 6:02）
#    - cron: '02 06 * * *'
#    # 晚间任务：北京时间每天 20:05（UTC 12:05）
#    - cron: '05 12 * * *'
#    # 晚间任务：北京时间每天 23:05（UTC 15:05）
#    - cron: '05 15 * * *'
  workflow_dispatch:  # 手动触发
  repository_dispatch:
    types:
      - reading

jobs:
  running:
    # 运行环境
    runs-on: ubuntu-latest
    # 运行步骤
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release

      - uses: nick-fields/retry@v3
        id: retry-command
        env:
          VID: ${{ secrets.VID }}
          SKEY: ${{ secrets.SKEY }}
          FEISHU_BOT_URL: ${{ secrets.FEISHU_BOT_URL }}
        with:
          timeout_minutes: 1
          max_attempts: 5
          retry_wait_seconds: 5
          command: |
            chmod -R 777 wxread_bot_linux_amd64
            ./wxread_bot_linux_amd64 -f 1

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          retain_days: 3
          keep_minimum_runs: 8

  keepalive-job:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: running
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1